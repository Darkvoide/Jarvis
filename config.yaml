# ─────────────────────────────────────────────
#  JARVIS Configuration
# ─────────────────────────────────────────────

ollama:
  host: "http://localhost:11434"
  # Main reasoning / tool-calling model
  # Recommended: qwen2.5:7b  |  llama3.2:3b  |  mistral:7b
  model: "qwen2.5:7b"
  # Vision model (must support images). Set to null to stub vision tools.
  # Pull first: ollama pull llava  OR  ollama pull minicpm-v
  vision_model: null   # e.g. "llava:7b"
  timeout: 120

stt:
  # "continuous" (hands-free auto-detect) or "ptt" (hold key to speak)
  mode: "continuous"
  # faster-whisper model size — ACCURACY RANKED:
  #   tiny (fastest, least accurate) | base | small (best balance) | medium | large-v3 (most accurate)
  # ↑ Upgrade to "small" for better Tamil+English accuracy on CPU. "base" if speed is priority.
  model_size: "small"
  device: "cpu"          # "cpu" or "cuda"
  compute_type: "int8"   # "int8" (fastest cpu) | "float16" (needs cuda) | "float32"
  # FIX: Pin language to "ta" for Tamil-dominant speech, or "en" for English-only
  # "null" makes Whisper guess — causing hi/ta/en confusion (seen in logs)
  # For Tanglish (Tamil+English mix), set language to null but use initial_prompt below
  language: null
  # initial_prompt nudges Whisper toward Tamil+English and your vocabulary:
  initial_prompt: "JARVIS, screenshot, volume, browser, open, close, play, pause."
  vad_filter: true
  # VAD aggressiveness — silenceMs before cutting off (was 250ms, too aggressive for short words)
  vad_min_silence_ms: 400
  # Minimum language detection probability before accepting transcript (0.0=off, 0.5=recommended)
  min_language_prob: 0.40
  # Reject transcripts that are just noise artifacts
  no_speech_threshold: 0.6

tts:
  # "edge-tts" – Microsoft Edge Neural TTS (Natural Tamil & English voices)
  # "pyttsx3"  – fully offline fallback
  backend: "edge-tts"
  rate: 175          # words per minute (pyttsx3 only)
  volume: 1.0        # 0.0 – 1.0 (pyttsx3 only)
  # edge-tts voice for English (Tamil uses ta-IN-PallaviNeural automatically)
  edge_voice: "en-US-ChristopherNeural"

input:
  # Push-to-talk hotkey. Options: F9, F10, ctrl+space, etc.
  ptt_key: "F9"
  # Camera index for vision/gesture (0 = default webcam)
  camera_index: 0
  # Enable gesture watcher on startup
  gesture_enabled: true
  # Gesture debounce in seconds — reduce false repeats (1.2s = recommended)
  gesture_debounce: 1.2
  # Directly execute Windows system actions without going through the LLM
  direct_gestures: true
  # Minimum gesture confidence to accept (0.0-1.0). Raise to reduce false positives.
  gesture_min_confidence: 0.80

permissions:
  # Allow execute_command tool
  allow_shell: true
  # Allow read_file tool
  allow_file_read: true
  # Paths the file tool may access (empty list = unrestricted within user home)
  allowed_paths: []
  # Commands blocked from execute_command (regex patterns)
  blocked_commands:
    - "rm -rf"
    - "format"
    - "del /f"

logging:
  level: "INFO"    # DEBUG | INFO | WARNING | ERROR
  file: "jarvis.log"
